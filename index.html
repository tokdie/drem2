<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B — Tokdie Check</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2b3138; --txt:#c9d1d9;
          --ok:#3fb950; --bad:#f85149; --warn:#d29922; --dim:#7d8590; --accent:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;
         background:var(--bg); color:var(--txt); padding:16px; }
  .wrap { max-width:640px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:8px; padding:16px; margin-bottom:10px; }
  h1 { font-size:18px; margin:0 0 4px; }
  h2 { font-size:12px; margin:0 0 8px; color:var(--dim);
       text-transform:uppercase; letter-spacing:.08em; }
  button { background:#21262d; color:var(--txt); border:1px solid var(--line);
           border-radius:6px; padding:10px 16px; font:inherit; cursor:pointer;
           width:100%; margin:4px 0; }
  button:hover { border-color:var(--dim); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.primary { border-color:var(--accent); color:var(--accent); }
  button.danger { border-color:var(--bad); color:var(--bad); }
  button.active { border-color:var(--ok); color:var(--ok); }
  textarea, input { background:#0a0d12; color:var(--txt); border:1px solid var(--line);
                    border-radius:6px; padding:8px; font:inherit; width:100%;
                    margin:4px 0; resize:vertical; }
  textarea { min-height:70px; }
  pre { background:#0a0d12; border:1px solid var(--line); border-radius:6px;
        padding:8px; margin:4px 0; white-space:pre-wrap; word-break:break-all;
        font-size:11px; max-height:180px; overflow:auto; }
  .kv { display:grid; grid-template-columns:110px 1fr; gap:3px 10px; margin:6px 0; }
  .kv b { color:var(--dim); font-weight:400; }
  .status { padding:8px 12px; border-radius:6px; margin:6px 0; font-size:12px; }
  .status.ok { background:#1a2f1a; color:var(--ok); }
  .status.err { background:#3a1a1a; color:var(--bad); }
  .status.warn { background:#2f2a1a; color:var(--warn); }
  .muted { color:var(--dim); font-size:11px; }
  .row { display:flex; gap:8px; }
  .row > button { flex:1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>Tokdie Check</h1>
    <p class="muted">Open in Trust Wallet in-app browser.</p>
    <div class="kv" id="env_top"></div>
  </div>

  <div class="panel">
    <h2>input</h2>
    <textarea id="input" placeholder='Paste JSON from A'></textarea>
    <button onclick="parseInput()">Parse</button>
    <button onclick="connect()" id="btn_connect">Connect Trust Wallet</button>
    <div class="status" id="connect_status"></div>
  </div>

  <div class="panel">
    <h2>verify</h2>
    <button class="primary" onclick="verify()" id="btn_verify" disabled>Verify</button>
    <div class="status" id="verify_status"></div>
    <div class="kv" id="verify_result"></div>
  </div>

  <div class="panel">
    <h2>transfer USDT</h2>
    <div class="row">
      <button onclick="setMode('naive')" id="btn_naive">naive</button>
      <button onclick="setMode('secure')" id="btn_secure">secure</button>
    </div>
    <div class="kv" id="mode_display"></div>
    <div class="kv">
      <b>recipient</b><input id="recipient" placeholder="T…">
      <b>amount</b><input id="amount" value="1">
    </div>
    <button class="danger" onclick="executeTransfer()" id="btn_transfer" disabled>Transfer</button>
    <div class="status" id="transfer_status"></div>
  </div>

  <div class="panel"><h2>log</h2><pre id="log_out">—</pre></div>
</div>

<script type="module">
import { TrustAdapter } from 'https://esm.sh/@tronweb3/tronwallet-adapter-trust@1.2.0';
import { TronWeb } from 'https://esm.sh/tronweb@5.3.2';

const DAPP_HOST = 'tokdie.github.io/drem2';
const USDT_CONTRACT = 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t';
const USDT_DECIMALS = 6;
const FEE_LIMIT_SUN = 100_000_000;

let adapter = null;
let bAddress = null;
let parsed = null;
let mode = 'naive';
let verifyOk = false;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const log = (k, m, d) => {
  const el = $('log_out');
  const line = `[${new Date().toISOString().slice(11,23)}] ${k.padEnd(9)} ${m}`;
  const body = d !== undefined ? '\n  ' + JSON.stringify(d, null, 2).split('\n').join('\n  ') : '';
  el.textContent = (el.textContent === '—' ? '' : el.textContent) + line + body + '\n';
  el.scrollTop = el.scrollHeight;
};

const setStatus = (el, cls, text) => {
  const node = $(el);
  node.className = 'status ' + (cls || '');
  node.textContent = text;
};

function renderEnv() {
  const injected = !!(window.trustwallet && window.trustwallet.tronLink && window.trustwallet.tronLink.tronWeb);
  $('env_top').innerHTML = `
    <b>dapp_host</b><span>${esc(DAPP_HOST)}</span>
    <b>in-app inject</b><span style="color:${injected ? 'var(--ok)' : 'var(--bad)'}">${injected ? 'window.trustwallet.tronLink' : 'not found'}</span>
    <b>B address</b><span>${bAddress || '—'}</span>
  `;
}

function renderMode() {
  $('mode_display').innerHTML = `<b>mode</b><span style="color:${mode === 'naive' ? 'var(--bad)' : 'var(--ok)'}">${mode}</span>`;
  $('btn_naive').className = 'danger' + (mode === 'naive' ? ' active' : '');
  $('btn_secure').className = '' + (mode === 'secure' ? ' active' : '');
}

function setMode(m) { mode = m; renderMode(); checkReady(); }

async function connect() {
  $('btn_connect').disabled = true;
  setStatus('connect_status', '', 'Connecting…');

  try {
    adapter = new TrustAdapter({ openAppWithDeeplink: false });

    const addr = await adapter.connect();
    bAddress = addr || adapter.address;

    if (!bAddress) {
      throw new Error('no address — open in Trust Wallet in-app browser');
    }

    setStatus('connect_status', 'ok', 'Connected: ' + bAddress);
    renderEnv();
    checkReady();
  } catch (e) {
    console.error('[B connect]', e);
    setStatus('connect_status', 'err', 'Connect failed: ' + (e.message || e) + '. Open in Trust Wallet in-app browser.');
    $('btn_connect').disabled = false;
    renderEnv();
  }
}

function parseInput() {
  const raw = $('input').value.trim();
  if (!raw) { setStatus('verify_status', 'err', 'Paste JSON.'); return; }
  try {
    parsed = JSON.parse(raw);
    if (!parsed.text || !parsed.sig || !parsed.signer) throw new Error('missing fields');
    $('btn_verify').disabled = false;
    verifyOk = false;
    setStatus('verify_status', 'ok', 'Parsed.');
    checkReady();
  } catch (e) {
    setStatus('verify_status', 'err', 'Parse failed: ' + e.message);
  }
}

async function verify() {
  if (!parsed) return;
  try {
    setStatus('verify_status', '', 'Verifying…');

    const tronWeb = new TronWeb({ fullHost: 'https://api.trongrid.io' });
    const recovered = await tronWeb.trx.verifyMessageV2(parsed.text, parsed.sig);
    const match = recovered === parsed.signer;

    log('VERIFY', 'result', { recovered, expected: parsed.signer, match });

    $('verify_result').innerHTML = `
      <b>text</b><span>${esc(parsed.text)}</span>
      <b>expected</b><span>${esc(parsed.signer)}</span>
      <b>recovered</b><span style="color:${match ? 'var(--ok)' : 'var(--bad)'}">${esc(recovered)}</span>
      <b>match</b><span style="color:${match ? 'var(--ok)' : 'var(--bad)'}">${match ? 'YES' : 'NO'}</span>
    `;

    if (!match) {
      verifyOk = false;
      setStatus('verify_status', 'err', 'Signature mismatch.');
      checkReady();
      return;
    }

    if (mode === 'secure') {
      const hasDomain = parsed.text.includes(DAPP_HOST) || /\bdomain\s*[:=]\s*B/i.test(parsed.text);
      if (!hasDomain) {
        verifyOk = false;
        setStatus('verify_status', 'warn', 'SECURE: no domain:B — reject.');
        checkReady();
        return;
      }
    }

    verifyOk = true;
    setStatus('verify_status', 'ok', 'Valid.');
    checkReady();
  } catch (e) {
    log('VERIFY', 'error', { message: e.message });
    setStatus('verify_status', 'err', 'Verify error: ' + e.message);
    checkReady();
  }
}

function checkReady() {
  const can = !!(verifyOk && parsed && adapter && bAddress && mode === 'naive');
  $('btn_transfer').disabled = !can;
}

async function executeTransfer() {
  if (!adapter || !bAddress || !verifyOk || mode === 'secure') return;

  const recipient = $('recipient').value.trim();
  const amount = Number($('amount').value.trim());

  if (!/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(recipient)) {
    setStatus('transfer_status', 'err', 'Invalid TRON address.'); return;
  }
  if (!Number.isFinite(amount) || amount <= 0) {
    setStatus('transfer_status', 'err', 'Invalid amount.'); return;
  }

  try {
    setStatus('transfer_status', '', 'Building transfer…');
    const tw = window.trustwallet.tronLink.tronWeb;
    const amountSun = Math.floor(amount * Math.pow(10, USDT_DECIMALS));

    const tx = await tw.transactionBuilder.triggerSmartContract(
      USDT_CONTRACT,
      'transfer(address,uint256)',
      { feeLimit: FEE_LIMIT_SUN },
      [{ type: 'address', value: recipient }, { type: 'uint256', value: amountSun }],
      bAddress
    );

    if (!tx.result || !tx.result.result) throw new Error('build failed');

    log('TRANSFER', 'built tx', { txID: tx.transaction.txID });

    setStatus('transfer_status', '', 'Confirm in Trust…');
    const signed = await adapter.signTransaction(tx.transaction);

    const receipt = await tw.trx.sendRawTransaction(signed);
    log('TRANSFER', 'broadcast', receipt);

    if (receipt.result === true || receipt.code === 'SUCCESS') {
      setStatus('transfer_status', 'ok', 'Broadcast: ' + (receipt.txid || signed.txID));
    } else {
      setStatus('transfer_status', 'err', 'Broadcast failed: ' + JSON.stringify(receipt));
    }
  } catch (e) {
    log('TRANSFER', 'error', { message: e.message });
    setStatus('transfer_status', 'err', 'Transfer error: ' + e.message);
  }
}

renderEnv();
renderMode();
log('BOOT', 'B up', { host: DAPP_HOST });
</script>
</body>
</html>
